<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: left;
        }
        h2 {
            color: #444;
        }
        .btn {
            background: #b98686;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background: #ab676d;
        }
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .input-field {
            width: 80%;
            padding: 10px;
            margin-bottom: 10px;
        }
        .list {
            margin-top: 20px;
            text-align: left;
        }
        .list-item {
            background: #f8d7da;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .remove-btn {
            background: #e2a3e1;
            color: white;
            padding: 5px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>My To-Do List</h2>
        <button class="btn" onclick="showPopup()">Add Task</button>
        <div class="list" id="taskList"></div>
    </div>

    <div class="popup" id="popup">
        <input type="text" class="input-field" id="taskInput" placeholder="Enter your task">
        <button class="btn" onclick="addTask()">Add</button>
        <button class="btn" onclick="closePopup()">Close</button>
    </div>

    <script>
        function showPopup() {
            document.getElementById("popup").style.display = "block";
        }

        function closePopup() {
            document.getElementById("popup").style.display = "none";
        }

        function addTask() {
            let taskText = document.getElementById("taskInput").value;
            if (taskText.trim() === "") return;

            let taskList = document.getElementById("taskList");
            let listItem = document.createElement("div");
            listItem.className = "list-item";
            listItem.innerHTML = `<span>${taskText}</span> <button class="remove-btn" onclick="removeTask(this)">Remove</button>`;

            taskList.appendChild(listItem);
            document.getElementById("taskInput").value = "";
            closePopup();
        }

        function removeTask(button) {
            button.parentElement.remove();
        }
    </script>

</body>
</html>
